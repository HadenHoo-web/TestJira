<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Web Đơn Giản</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #1f3b57;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Web test đơn giản</h1>
    <p>Nhấn nút bên dưới để test HTML + CSS + JavaScript</p>
    <button onclick="showMessage()">Bấm thử</button>
    <div id="result">Chưa bấm gì hết</div>
  </div>

  <script>
    function showMessage() {
      const now = new Date();
      document.getElementById("result").innerText =
        "Đã chạy JS thành công lúc: " + now.toLocaleTimeString("vi-VN");
    }
  </script>
</body>
</html>
